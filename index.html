<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognifyz Certificate Validation</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px;
    background: #f5f6f8;
    font-family: "Nunito Sans", "Segoe UI", Arial, sans-serif;
    color: #212529;
  }
  .page-title {
    max-width: 920px;
    margin: 8px auto 22px;
    text-align: center;
    font-size: 36px;
    font-weight: 800;
  }
  .card {
    max-width: 920px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    padding: 38px 38px 44px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
  }
  h1 { margin: 0 0 24px; font-size: 32px; font-weight: 700; }
  p.hint { margin: 0 0 30px; color: #6c757d; font-size: 17px; }
  .row { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
  .input-group { display: flex; flex: 1 1 320px; min-width: 0; }
  .prefix {
    display: flex; align-items: center;
    padding: 0 16px;
    background: #e9ecef;
    border: 1px solid #ced4da;
    border-right: 0;
    border-radius: 4px 0 0 4px;
    font-size: 18px; color: #495057;
    white-space: nowrap;
  }
  input {
    flex: 1; min-width: 0;
    padding: 14px 16px;
    font: inherit; font-size: 18px;
    border: 1px solid #ced4da;
    border-radius: 0 4px 4px 0;
    outline: none;
  }
  input:focus { border-color: #22c77a; box-shadow: 0 0 0 3px rgba(34, 199, 122, 0.2); }
  button {
    flex: 0 0 270px;
    padding: 14px 20px;
    background: #22c77a;
    color: #fff;
    border: 0; border-radius: 4px;
    font: inherit; font-size: 18px; font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  button:hover { background: #1db56e; }
  button:focus-visible { outline: 3px solid #0f7a49; outline-offset: 2px; }
  @media (max-width: 600px) { button { flex: 1 1 100%; } }

  #result { margin-top: 26px; min-height: 28px; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
  #result.success { color: #1a9d5f; }
  #result.error { color: #d63b3b; }
  .tick {
    width: 30px; height: 30px; flex: none;
    border-radius: 50%;
    background: #22c77a;
    display: grid; place-items: center;
  }
  .tick svg { width: 18px; height: 18px; }
  .tick path {
    fill: none; stroke: #fff; stroke-width: 3;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 24; stroke-dashoffset: 24;
    animation: draw .4s ease forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .tick path { animation: none; stroke-dashoffset: 0; } }

  /* Result table */
  .table-wrap { margin-top: 22px; overflow-x: auto; border: 1px solid #dee2e6; }
  .table-wrap[hidden] { display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 18px; min-width: 640px; }
  th, td { padding: 16px; text-align: left; vertical-align: top; border-right: 1px solid #dee2e6; line-height: 1.8; }
  th:last-child, td:last-child { border-right: 0; }
  thead th { background: #e9ecef; font-weight: 700; color: #343a40; border-bottom: 2px solid #dee2e6; vertical-align: bottom; }
  tbody td { background: #fff; }
</style>
</head>
<body>
  <h2 class="page-title">Cognifyz Certificate Validation</h2>

  <div class="card">
    <h1>Internship Verification</h1>
    <p class="hint">Enter your ID number (example: 12345) to verify details.</p>

    <div class="row">
      <div class="input-group">
        <span class="prefix">CTI/A3/C</span>
        <input id="idInput" type="text" inputmode="numeric" placeholder="12345" autocomplete="off" aria-label="ID number">
      </div>
      <button id="verifyBtn" type="button">VERIFY</button>
    </div>

    <div id="result" role="status" aria-live="polite"></div>

    <div class="table-wrap" id="tableWrap" hidden>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Domain</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Total Duration</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td id="cId"></td>
            <td id="cName"></td>
            <td id="cDomain"></td>
            <td id="cStart"></td>
            <td id="cEnd"></td>
            <td id="cDuration"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
  const PREFIX = "CTI/A3/C";

  // Demo data: add more IDs here
  const RECORDS = {
    "3556": {
      name: "SUJAL KSHATRI",
      domain: "AI Intern",
      start: "02-05-2026",
      end: "28-06-2026",
      duration: "8 WEEKS"
    }
  };

  const input = document.getElementById("idInput");
  const result = document.getElementById("result");
  const tableWrap = document.getElementById("tableWrap");

  function verify() {
    const value = input.value.trim();
    result.className = "";
    result.innerHTML = "";
    tableWrap.hidden = true;

    if (!value) {
      result.className = "error";
      result.textContent = "Please enter your ID number.";
      return;
    }

    const rec = RECORDS[value];
    if (rec) {
      result.className = "success";
      result.innerHTML =
        '<span class="tick"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>' +
        '<span>Valid Certificate</span>';

      document.getElementById("cId").textContent = PREFIX + value;
      document.getElementById("cName").textContent = rec.name;
      document.getElementById("cDomain").textContent = rec.domain;
      document.getElementById("cStart").textContent = rec.start;
      document.getElementById("cEnd").textContent = rec.end;
      document.getElementById("cDuration").textContent = rec.duration;
      tableWrap.hidden = false;
    } else {
      result.className = "error";
      result.textContent = "ID not found. Check the number and try again.";
    }
  }

  document.getElementById("verifyBtn").addEventListener("click", verify);
  input.addEventListener("keydown", e => { if (e.key === "Enter") verify(); });
</script>
</body>
</html>
